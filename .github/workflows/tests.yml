name: CPU regression tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.4.0 torchvision==0.19.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Check source and run tests
        env:
          HF_HUB_OFFLINE: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python -m compileall -q main.py models trainers utils scripts
          python -m unittest discover -s scripts/tests -v
          python scripts/run_inference.py retrieval --list
          python scripts/run_inference.py generation --list
          for script in scripts/*.sh; do bash -n "$script"; done
